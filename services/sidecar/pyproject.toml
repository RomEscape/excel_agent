[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "office-claw-sidecar"
version = "0.1.0"
description = "Privacy-focused AI work agent - Python sidecar backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "keyring>=25.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.130.0",
    "python-telegram-bot>=21.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "xlsxwriter>=3.2.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    # Phase 3: 멀티 메신저 어댑터
    "slack-bolt>=1.18.0",
    "discord.py>=2.3.0",
    "websockets>=12.0",
    "xlwings>=0.33.0",
    "pywin32>=306; platform_system == 'Windows'",
    # 모노레포 공용 계약 (와이어 프로토콜 + 코덱)
    "oc-protocol",
    "oc-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
office-claw-sidecar = "office_claw_sidecar.main:main"

[tool.uv.sources]
oc-protocol = { path = "../../packages/protocol/python", editable = true }
oc-shared = { path = "../../packages/py-shared", editable = true }

# Ruff lint 규칙을 명시적으로 고정한다.
# 이유: CI·로컬 모두 `uvx ruff check .`로 최신 ruff를 받는데(버전 미고정),
# ruff 0.16.0이 기본 룰셋을 넓히면서 기존 코드가 무더기로 걸려 python-check가 나갔다.
# select를 명시하면 룰셋이 ruff 버전 기본값에 의존하지 않아, 버전이 올라가도 흔들리지 않는다.
# 값은 그동안 실효로 강제되던 ruff 기본 규칙(E4/E7/E9/F)과 동일하게 유지한다.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
