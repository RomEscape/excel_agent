[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "office-claw-sidecar"
version = "0.1.0"
description = "Privacy-focused AI work agent - Python sidecar backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "keyring>=25.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.6",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "xlsxwriter>=3.2.0",
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    # relay 아웃바운드 WS 클라이언트 (services/relay_client.py)
    "websockets>=12.0",
    "xlwings>=0.33.0",
    "pywin32>=306; platform_system == 'Windows'",
    # 모노레포 공용 계약 (와이어 프로토콜 + 코덱)
    "oc-protocol",
    "oc-shared",
]

[project.optional-dependencies]
# 여기 넣는 패키지는 로컬 PyInstaller 빌드 크기에 직결된다 — dev extra 를 동기화한
# 상태로 사이드카를 말면 그대로 번들에 들어간다. 실제로 sentence-transformers 가
# torch/transformers 를 끌어와 64MB 산출물을 201MB 로 부풀리고 있었다(미사용).
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
    # 사이드카 네이티브 컴파일(하드닝). 우리 코드가 import 하지 않으므로 번들에는
    # 들어가지 않는다 — pyinstaller 와 같은 성격의 빌드 도구다.
    #
    # **lockfile 에 반드시 있어야 한다.** `uv pip install nuitka` 로 곁다리 설치하면
    # 이후 누군가 `uv sync` 를 돌리는 순간 지워지고, 그게 컴파일 도중이면
    # `operations_binary_matmult.h file not found` 같은 엉뚱한 C 에러로 나타난다.
    "nuitka>=4.1",
]

[project.scripts]
office-claw-sidecar = "office_claw_sidecar.main:main"

[tool.uv.sources]
oc-protocol = { path = "../../packages/protocol/python", editable = true }
oc-shared = { path = "../../packages/py-shared", editable = true }

# Ruff lint 규칙을 명시적으로 고정한다.
# 이유: CI·로컬 모두 `uvx ruff check .`로 최신 ruff를 받는데(버전 미고정),
# ruff 0.16.0이 기본 룰셋을 넓히면서 기존 코드가 무더기로 걸려 python-check가 나갔다.
# select를 명시하면 룰셋이 ruff 버전 기본값에 의존하지 않아, 버전이 올라가도 흔들리지 않는다.
# 값은 그동안 실효로 강제되던 ruff 기본 규칙(E4/E7/E9/F)과 동일하게 유지한다.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# 배포 대상은 사이드카 패키지 하나다. 이걸 안 적으면 setuptools가 flat-layout에서
# scripts/·scenarios/·tests/까지 최상위 패키지로 보고 "Multiple top-level packages"
# 에러를 낸다. 지금까지는 빌드된 wheel이 캐시에 남아 있어 안 드러났을 뿐이다.
[tool.setuptools.packages.find]
include = ["office_claw_sidecar*"]
