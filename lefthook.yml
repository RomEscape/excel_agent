# lefthook.yml
# CI(.github/workflows/pr-check.yml)와 동일한 검증을 로컬에서 자동 실행하는 "CI 미러" 훅.
#   - pre-commit : 빠른 정적검사. staged 파일과 관련된 것만 실행 → 빨간 코드를 커밋 단계에서 차단
#   - pre-push   : CI 전체 미러(테스트 포함) → push 전 마지막 게이트
#
# 설치   : npm install  (package.json의 prepare 스크립트가 `lefthook install`을 자동 실행)
# 긴급 우회: git commit --no-verify  /  git push --no-verify
#
# private+free에서는 GitHub가 "빨간 PR merge 차단"을 강제할 수 없으므로,
# 이 로컬 훅이 1차 방어선이고 pr-check.yml(CI)이 2차 표시선이다.

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "apps/desktop/src-tauri/**/*.rs"
      root: "apps/desktop/src-tauri/"
      run: cargo fmt --check
    python-lint:
      glob: "services/sidecar/**/*.py"
      root: "services/sidecar/"
      # uv가 없는 개발기(2026-08-16 Windows 실측)에서는 uvx가 없어 훅이 통째로 실패했다.
      run: if command -v uvx >/dev/null 2>&1; then uvx ruff check .; else ./.venv/Scripts/ruff.exe check .; fi
    frontend-lint:
      glob: "apps/desktop/src/**/*.{ts,tsx,js,jsx}"
      root: "apps/desktop/"
      run: npm run lint --if-present
    devlog-guard:
      run: cd services/sidecar && sh ../../scripts/py-run.sh scripts/append_devlog_from_reports.py --devlog ../../개발일지.md --complex-report ../../logs/excel_complex_verify_report.json --release-gate ../../logs/eval_release_gate.json --from-staged --skip-if-devlog-staged && node ../../scripts/check-devlog-update.mjs --staged
    # 커밋마다 도는 **빠른 회귀 핀**(약 2초). 전체 pytest는 4~5분이라 pre-push 몫이고,
    # 이 파일에는 실측으로 잡은 파괴·오실행 핀이 모여 있어 되돌아가는 걸 즉시 막는다
    # (2026-08-22 결정 5: 게이트 자동화의 가장 앞단).
    python-pins:
      glob: "services/sidecar/**/*.py"
      root: "services/sidecar/"
      run: sh ../../scripts/py-run.sh -m pytest -q tests/test_battery_regressions.py
    mobile-analyze:
      glob: "apps/mobile/**/*.dart"
      root: "apps/mobile/"
      run: flutter analyze

pre-push:
  parallel: true
  commands:
    rust-clippy:
      root: "apps/desktop/src-tauri/"
      run: cargo clippy --all-targets -- -D warnings
    python-test:
      root: "services/sidecar/"
      run: sh ../../scripts/py-run.sh -m pytest -q
    frontend-test:
      root: "apps/desktop/"
      run: npm run test:unit --if-present
    mobile-test:
      root: "apps/mobile/"
      run: flutter test
