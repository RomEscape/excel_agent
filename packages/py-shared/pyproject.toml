[project]
name = "oc-shared"
version = "0.1.0"
description = "sidecar↔relay 공용 순수 파이썬 — 프레임 코덱, 재연결 replay 버퍼, 페어링 토큰"
requires-python = ">=3.10"
dependencies = ["oc-protocol", "pydantic>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oc_shared"]

[tool.uv.sources]
oc-protocol = { path = "../protocol/python", editable = true }
