name: Release

# 버전 태그(v1.0.0 등)를 push할 때만 실행
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

  # 배포 산출물이 올라가는 **별도 저장소**. 소스 저장소(officeclaw)는 비공개
  # 개발 이력이고, 사용자가 받는 설치파일만 여기로 나간다.
  #
  # 이 저장소로 릴리스를 만들려면 기본 GITHUB_TOKEN으로는 안 된다 — 그 토큰의
  # 권한은 현재 저장소에만 미친다. `KDR_RELEASE_TOKEN` 시크릿(대상 저장소에
  # contents:write 권한이 있는 PAT 또는 GitHub App 토큰)이 필요하다.
  RELEASE_REPO: sadStoneTurtle/kdr_release

jobs:
  # ── 1단계: 플랫폼별 빌드 ────────────────────────────────────────────────────
  #
  # 여기서는 **릴리스를 만들지 않는다**. tauri-action에 tagName을 주지 않으면
  # 빌드만 하고 산출물 경로를 output으로 돌려준다. 릴리스 생성은 2단계 publish
  # 잡이 단독으로 맡는다 — 매트릭스 잡 2개가 동시에 릴리스를 만들려 들면
  # 경합이 나서 릴리스가 둘 생기거나 한쪽이 실패한다.
  build:
    # Intel Mac(x86_64-apple-darwin)은 의도적으로 뺐다.
    #   - Apple Silicon 전환이 2020년에 시작돼 신규 사용자 대부분이 ARM이다.
    #   - macOS 러너는 청구 분이 10배라, Intel 잡 하나가 릴리스당 ~180분을 먹는다.
    #     빼는 것만으로 릴리스 비용이 절반 가까이 줄어든다.
    # 되살리려면 이 매트릭스에 항목을 더하고, 랜딩 페이지 다운로드 버튼도 함께
    # 늘려야 한다(브라우저는 Apple Silicon과 Intel Mac을 구분하지 못한다).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin     # macOS Apple Silicon
            sidecar_suffix: aarch64-apple-darwin
            asset_platform: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc   # Windows
            sidecar_suffix: x86_64-pc-windows-msvc
            asset_platform: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      # 1. 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. Python + uv 설치
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Python 3.12 설치
        run: uv python install 3.12

      - name: Python 의존성 설치 (uv venv)
        working-directory: services/sidecar
        run: |
          uv sync
          uv pip install pyinstaller

      # 3. PyInstaller로 사이드카 바이너리 빌드
      #    출력 바이너리를 Tauri externalBin 규칙(binaries/{name}-{target})으로 저장
      #
      #    hidden-import는 **PyInstaller의 정적 분석이 놓치는 것만** 적는다.
      #    xlwings의 플랫폼 백엔드(macOS appscript/aem, Windows pywin32의
      #    pythoncom·pywintypes·win32com)와 keyring 백엔드는 PyInstaller가
      #    번들 훅으로 이미 처리하므로 여기 적지 않는다 — 적어도 무해하지만,
      #    없는 모듈을 적으면 PyInstaller가 ERROR 로그를 뿜어 진짜 실패를 가린다.
      #    (예전에 지운 slack_bolt·discord가 그 상태로 남아 있었다.)
      - name: 사이드카 바이너리 빌드 (Unix)
        if: runner.os != 'Windows'
        working-directory: services/sidecar
        run: |
          uv run pyinstaller \
            --onefile \
            --name office-claw-sidecar \
            --hidden-import office_claw_sidecar \
            --hidden-import uvicorn \
            --hidden-import fastapi \
            office_claw_sidecar/__main__.py
          mkdir -p ../../apps/desktop/src-tauri/binaries
          cp dist/office-claw-sidecar \
             "../../apps/desktop/src-tauri/binaries/office-claw-sidecar-${{ matrix.sidecar_suffix }}"

      - name: 사이드카 바이너리 빌드 (Windows)
        if: runner.os == 'Windows'
        working-directory: services/sidecar
        shell: pwsh
        run: |
          uv run pyinstaller `
            --onefile `
            --name office-claw-sidecar `
            --hidden-import office_claw_sidecar `
            --hidden-import uvicorn `
            --hidden-import fastapi `
            office_claw_sidecar/__main__.py
          New-Item -ItemType Directory -Force -Path ../../apps/desktop/src-tauri/binaries
          Copy-Item dist/office-claw-sidecar.exe `
            "../../apps/desktop/src-tauri/binaries/office-claw-sidecar-${{ matrix.sidecar_suffix }}.exe"

      # 3-1. 번들 사이드카가 실제로 기동하는지 확인 (스모크)
      #      상대 import 때문에 번들만 죽던 사고가 있었다(78213c6) — 개발 중에는
      #      `python -m`으로 돌아 재현되지 않으므로, 산출물을 직접 실행해야 잡힌다.
      - name: 사이드카 기동 스모크 (Unix)
        if: runner.os != 'Windows'
        working-directory: services/sidecar
        run: ./dist/office-claw-sidecar --smoke-test

      - name: 사이드카 기동 스모크 (Windows)
        if: runner.os == 'Windows'
        working-directory: services/sidecar
        shell: pwsh
        run: ./dist/office-claw-sidecar.exe --smoke-test

      # 4. Node.js 설치 및 JS 빌드
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: JS 의존성 설치
        working-directory: apps/desktop
        run: npm ci

      - name: React 빌드
        working-directory: apps/desktop
        run: npm run build

      # 5. Rust 설치
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      # 6. Tauri 빌드 (릴리스 생성 없음)
      #    tagName을 주지 않으면 tauri-action은 빌드만 하고 artifactPaths를 낸다.
      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}

      # 7. 자산 이름 고정
      #    랜딩 페이지가 `releases/latest/download/<고정이름>`을 영구 URL로 쓴다.
      #    버전이 들어가면 릴리스마다 (다른 저장소에 있는) 랜딩 페이지를 고쳐야
      #    하고, 기본 이름은 productName인 한글 `김대리`가 들어가 URL 인코딩도
      #    지저분해진다. 예전에는 tauri-action의 releaseAssetNamePattern이 이
      #    일을 했는데, 업로드를 직접 하게 되면서 그 옵션이 안 먹으므로 여기서
      #    확장자 기준으로 다시 붙인다.
      #
      #    `.sig`를 `.tar.gz`보다 **먼저** 걸러야 한다 — 순서를 바꾸면
      #    `*.app.tar.gz.sig`가 tar.gz 가지에 먼저 걸려 서명이 본체를 덮어쓴다.
      - name: 자산 이름 정규화
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
          PLATFORM: ${{ matrix.asset_platform }}
        run: |
          set -euo pipefail
          mkdir -p assets
          # artifactPaths는 JSON 배열 문자열. jq는 모든 GitHub 러너에 기본 설치돼 있다.
          # (python3은 Windows 러너의 Git Bash PATH에 없을 수 있어 쓰지 않는다.)
          echo "$ARTIFACTS" | jq -r '.[]' | while read -r src; do
            name=$(basename "$src")
            case "$name" in
              *.sig)        dst="kimdaeri-${PLATFORM}.app.tar.gz.sig" ;;
              *.app.tar.gz) dst="kimdaeri-${PLATFORM}.app.tar.gz" ;;
              *.dmg)        dst="kimdaeri-${PLATFORM}.dmg" ;;
              *-setup.exe)  dst="kimdaeri-${PLATFORM}-setup.exe" ;;
              *.msi)        dst="kimdaeri-${PLATFORM}.msi" ;;
              *) echo "  건너뜀(배포 대상 아님): $name"; continue ;;
            esac
            cp "$src" "assets/$dst"
            echo "  $name -> $dst"
          done
          ls -la assets

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.asset_platform }}
          path: assets/*
          if-no-files-found: error
          retention-days: 7

  # ── 2단계: kdr_release 저장소에 릴리스 생성 ────────────────────────────────
  #
  # 단일 잡이라 경합이 없고, 두 플랫폼 산출물이 **하나의 릴리스**에 모인다.
  # 한쪽 빌드가 실패하면 여기까지 오지 않으므로 반쪽짜리 릴리스가 생기지 않는다.
  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 산출물 확인
        run: ls -la artifacts

      - name: kdr_release에 Draft 릴리스 생성
        env:
          # 기본 GITHUB_TOKEN은 현재 저장소에만 권한이 있다 — 대상 저장소에
          # contents:write가 있는 PAT가 필요하다.
          GH_TOKEN: ${{ secrets.KDR_RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::KDR_RELEASE_TOKEN 시크릿이 없습니다. $RELEASE_REPO 에 contents:write 권한이 있는 PAT를 등록하세요."
            exit 1
          fi

          PRERELEASE=""
          case "$TAG" in
            *-rc*|*-beta*|*-alpha*) PRERELEASE="--prerelease" ;;
          esac

          cat > /tmp/notes.md <<'NOTES'
          ## 변경사항
          이 릴리즈의 변경사항은 소스 저장소의 커밋 히스토리를 참고하세요.

          ## 설치 방법
          - **macOS (Apple Silicon)**: `kimdaeri-macos-aarch64.dmg`
          - **Windows**: `kimdaeri-windows-x86_64-setup.exe` 또는 `kimdaeri-windows-x86_64.msi`

          > Intel Mac은 지원하지 않습니다.
          > macOS는 아직 코드서명·공증 전이라, 처음 실행할 때
          > 시스템 설정 → 개인정보 보호 및 보안에서 열기를 허용해야 합니다.

          ## 시스템 요구사항
          - macOS 12 Monterey 이상 (Apple Silicon) / Windows 10 이상
          - 메모리 4GB 이상 권장
          - Ollama 설치 (로컬 LLM 사용 시) — 앱 내 설치 가이드 제공
          NOTES

          # Draft로 만든다 — 검토 후 직접 Publish.
          gh release create "$TAG" \
            --repo "$RELEASE_REPO" \
            --title "kimdaeri $TAG" \
            --notes-file /tmp/notes.md \
            --draft \
            $PRERELEASE \
            artifacts/*

          echo "생성됨: https://github.com/$RELEASE_REPO/releases/tag/$TAG (Draft)"
