name: Release

# 버전 태그(v1.0.0 등)를 push할 때만 실행
on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Intel Mac(x86_64-apple-darwin)은 의도적으로 뺐다.
    #   - Apple Silicon 전환이 2020년에 시작돼 신규 사용자 대부분이 ARM이다.
    #   - macOS 러너는 청구 분이 10배라, Intel 잡 하나가 릴리스당 ~180분을 먹는다.
    #     빼는 것만으로 릴리스 비용이 절반 가까이 줄어든다.
    # 되살리려면 이 매트릭스에 항목을 더하고, 랜딩 페이지 다운로드 버튼도 함께
    # 늘려야 한다(브라우저는 Apple Silicon과 Intel Mac을 구분하지 못한다).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin     # macOS Apple Silicon
            sidecar_suffix: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc   # Windows
            sidecar_suffix: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
      # 1. 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. Python + uv 설치
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Python 3.12 설치
        run: uv python install 3.12

      - name: Python 의존성 설치 (uv venv)
        working-directory: services/sidecar
        run: |
          uv sync
          uv pip install pyinstaller

      # 3. PyInstaller로 사이드카 바이너리 빌드
      #    출력 바이너리를 Tauri externalBin 규칙(binaries/{name}-{target})으로 저장
      - name: 사이드카 바이너리 빌드 (Unix)
        if: runner.os != 'Windows'
        working-directory: services/sidecar
        run: |
          uv run pyinstaller \
            --onefile \
            --name office-claw-sidecar \
            --hidden-import office_claw_sidecar \
            --hidden-import uvicorn \
            --hidden-import fastapi \
            --hidden-import slack_bolt \
            --hidden-import discord \
            office_claw_sidecar/__main__.py
          mkdir -p ../../apps/desktop/src-tauri/binaries
          cp dist/office-claw-sidecar \
             "../../apps/desktop/src-tauri/binaries/office-claw-sidecar-${{ matrix.sidecar_suffix }}"

      - name: 사이드카 바이너리 빌드 (Windows)
        if: runner.os == 'Windows'
        working-directory: services/sidecar
        shell: pwsh
        run: |
          uv run pyinstaller `
            --onefile `
            --name office-claw-sidecar `
            --hidden-import office_claw_sidecar `
            --hidden-import uvicorn `
            --hidden-import fastapi `
            --hidden-import slack_bolt `
            --hidden-import discord `
            office_claw_sidecar/__main__.py
          New-Item -ItemType Directory -Force -Path ../../apps/desktop/src-tauri/binaries
          Copy-Item dist/office-claw-sidecar.exe `
            "../../apps/desktop/src-tauri/binaries/office-claw-sidecar-${{ matrix.sidecar_suffix }}.exe"

      # 4. Node.js 설치 및 JS 빌드
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: JS 의존성 설치
        working-directory: apps/desktop
        run: npm ci

      - name: React 빌드
        working-directory: apps/desktop
        run: npm run build

      # 5. Rust 설치
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      # 6. Tauri 빌드 및 GitHub Releases 업로드
      #    tauri-apps/tauri-action이 빌드 + 릴리즈 생성 + 아티팩트 업로드를 한 번에 처리
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'kimdaeri ${{ github.ref_name }}'
          # 자산 이름에서 버전을 뺀다 — 랜딩 페이지가
          # `releases/latest/download/<고정이름>` 을 영구 URL로 쓰기 위함이다.
          # 버전이 들어가면 릴리스마다 랜딩 페이지를 고쳐야 한다.
          # 기본 이름은 productName(한글 `김대리`)이 들어가 URL 인코딩도 지저분해진다.
          releaseAssetNamePattern: 'kimdaeri-[platform]-[arch][ext]'
          releaseBody: |
            ## 변경사항
            이 릴리즈의 변경사항은 커밋 히스토리를 참고하세요.

            ## 설치 방법
            - **macOS (Apple Silicon)**: `kimdaeri-*.dmg`
            - **Windows**: `kimdaeri-*-setup.exe` 또는 `kimdaeri-*.msi`

            > Intel Mac은 지원하지 않습니다.
            > macOS는 아직 코드서명·공증 전이라, 처음 실행할 때
            > 시스템 설정 → 개인정보 보호 및 보안에서 열기를 허용해야 합니다.

            ## 시스템 요구사항
            - macOS 12 Monterey 이상 (Apple Silicon) / Windows 10 이상
            - 메모리 4GB 이상 권장
            - Ollama 설치 (로컬 LLM 사용 시) — 앱 내 설치 가이드 제공
          releaseDraft: true   # Draft로 생성 → 직접 검토 후 Publish
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          args: --target ${{ matrix.target }}
