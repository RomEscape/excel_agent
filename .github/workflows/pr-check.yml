name: PR-Check

on:
  pull_request:
    # dev가 통합 트렁크. main은 향후 릴리스 PR용으로 함께 둔다.
    branches: [dev, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0. 개발일지 강제 체크 (코드 변경 시 필수)
  devlog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 개발일지 업데이트 체크
        run: node ./scripts/check-devlog-update.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"

  # 1. Python sidecar 검증 (AI 로직 핵심)
  python-check:
    runs-on: ubuntu-latest
    needs: [devlog-check]
    env:
      # CI 러너에는 OS 키링 백엔드가 없어 keyring.errors.NoKeyringError 발생.
      # null 백엔드로 no-op 처리 (get→None, set→ignore) — 테스트는 응답 구조만 확인하므로 충분.
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    defaults:
      run:
        working-directory: services/sidecar
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.12 설치
        run: uv python install 3.12

      - name: 의존성 설치 (dev extras 포함, lockfile 고정)
        run: uv sync --frozen --extra dev

      # `uvx ruff`가 아니라 `uv run ruff`다. uvx는 매번 최신 ruff를 받아 오기 때문에
      # 우리가 코드를 안 건드려도 ruff 새 버전이 나오는 날 CI가 깨진다. dev extra에
      # 고정한 버전을 쓴다.
      - name: Lint 체크 (Ruff, 고정 버전)
        run: uv run ruff check .

      - name: Unit Test 실행
        run: uv run pytest -q

  # 2. Frontend 검증
  frontend-check:
    runs-on: ubuntu-latest
    needs: [devlog-check]
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/desktop/package-lock.json

      - name: 의존성 설치
        run: npm ci

      # `--if-present`를 뗐다. 지금까지 lint 스크립트가 없어서 이 잡은 통과가 아니라
      # 스킵이었다 — 초록불이 "검사했다"가 아니라 "안 했다"는 뜻이었다.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit Test
        run: npm run test:unit

      # 전체 코드의 38.9%인 프론트엔드가 빌드 검증조차 안 받고 있었다.
      # import 경로 오타 같은 건 여기서만 잡힌다.
      - name: 빌드 검증
        run: npm run build

  # 3. Rust(Tauri) 문법/린트 검증
  rust-check:
    runs-on: ubuntu-latest
    needs: [devlog-check]
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Tauri 시스템 의존성 설치 (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            libssl-dev

      - name: Rust toolchain (clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Cargo fmt 체크
        run: cargo fmt --check

      # Tauri build.rs는 externalBin(사이드카) 바이너리 존재를 검사한다.
      # CI에서는 PyInstaller 빌드를 돌리지 않으므로 더미 파일로 통과시킨다.
      # (clippy는 컴파일 안 함 → 실제 실행 안 되므로 stub로 충분)
      - name: 사이드카 더미 바이너리 생성 (clippy 용)
        run: |
          mkdir -p binaries
          touch binaries/office-claw-sidecar-x86_64-unknown-linux-gnu
          chmod +x binaries/office-claw-sidecar-x86_64-unknown-linux-gnu

      - name: Clippy 린트
        run: cargo clippy --all-targets -- -D warnings

  # 4. Flutter 모바일 앱 검증
  #
  # 빌드(APK/IPA)는 돌리지 않는다 — Android SDK/Xcode 준비에 수 분이 들고, PR 게이트가
  # 잡아야 할 것은 대부분 analyze/test 단계에서 걸린다. 실기기 산출물은 release.yml 몫.
  flutter-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK 설치
        uses: subosito/flutter-action@v2
        with:
          # 버전 고정: ruff 0.16이 기본 룰셋을 넓히며 python-check가 통째로 나갔던 것과
          # 같은 사고를 막는다. SDK가 로컬과 다르면 analyze 결과가 갈린다.
          # 올릴 때는 로컬 `flutter --version`과 함께 올린다.
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: 의존성 설치 (lockfile 고정)
        run: flutter pub get --enforce-lockfile

      - name: 정적 분석
        run: flutter analyze

      - name: Unit Test 실행
        run: flutter test
